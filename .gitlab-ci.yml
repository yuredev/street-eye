stages:
  - build
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/yuredev/street-eye-backend
  DOCKER_HOST: tcp://docker:2375  # Comunicação com Docker in Docker

build:
  stage: build
  image: maven:3.8.3-openjdk-17
  script:
    - mvn clean package -DskipTests
    - ls -lah target/  # Debug para ver se o .jar foi gerado corretamente
  artifacts:
    paths:
      - target/*.jar  # Isso armazena o .jar para o próximo estágio
    expire_in: 1h  # O artefato fica disponível por 1 hora

deploy:
  stage: deploy
  image: docker:24-cli
  services:
    - docker:24-dind
  script:
    - ls -lah target/  # Debug para ver se o .jar está disponível
    - docker build -t $IMAGE_NAME .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $IMAGE_NAME
    - echo "Fazendo deploy no Render..."
    # - curl -X POST "$RENDER_DEPLOY_HOOK"