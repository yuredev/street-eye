stages:
  - build
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/yuredev/street-eye-backend

build:
  stage: build
  image: maven:3.8.6-openjdk-17  # Usando uma imagem com Maven e OpenJDK 17
  script: 
    - mvn clean package -DskipTests
    - docker build -t $IMAGE_NAME
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME

deploy:
  stage: deploy
  script:
    - echo "Fazendo deploy no render..."
    # - curl -X POST https://api.render.com/deploy/srv-XXXXXXXX?key=API_KEY
