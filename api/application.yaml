spring:
  profiles:
    active:
    - local
  application:
    name: street-eye-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:URL_NAO_CARREGADA}
    username: ${SPRING_DATASOURCE_USERNAME:USERNAME_NAO_CARREGADO}
    password: ${SPRING_DATASOURCE_PASSWORD:PASSWORD_NAO_CARREGADO}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPGDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
