spring.datasource.url=${SPRING_DATASOURCE_URL:URL_NAO_CARREGADA}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:USERNAME_NAO_CARREGADO}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PASSWORD_NAO_CARREGADO}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPGDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
