services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: street_eye
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yure -d street_eye"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  api:
    image: street-eye-api:local
    build: 
      context: ./api
      dockerfile: Dockerfile
    ports: 
      - "3000:8080"
    environment:
      STREAM_OUTPUT_DIRECTORY: /stream/output
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./stream/output:/stream/output:ro
    depends_on:
      banco:
        condition: service_healthy
      
  stream:
    image: street-eye-stream:local
    build:
      context: ./stream
      dockerfile: Dockerfile
    volumes:
      - ./stream/output:/output

  frontend:
    image: street-eye-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"


