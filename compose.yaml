services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yure
      POSTGRES_PASSWORD: yure123
      POSTGRES_DB: street_eye
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yure -d street_eye"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  api:
    image: street-eye-api:local
    build: 
      context: ./api
      dockerfile: Dockerfile
    ports: 
      - "3000:8080"
    environment:
      STREAM_OUTPUT_DIRECTORY: /stream/output
    volumes:
      - ./stream/output:/stream/output:ro
    depends_on:
      banco:
        condition: service_healthy
      
  stream:
    image: street-eye-stream:local
    build:
      context: ./stream
      dockerfile: Dockerfile
    volumes:
      - ./stream/output:/output

  frontend:
    image: street-eye-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"


