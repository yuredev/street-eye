services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yure
      POSTGRES_PASSWORD: yure123
      POSTGRES_DB: street_eye
    ports:
      - "5432:5432"
      
  api:
    image: street-eye-api:local
    build: 
      context: ./api
      dockerfile: Dockerfile.app
    ports: 
      - "3000:8080"
    environment:
      STREAM_OUTPUT_DIRECTORY: /stream/output
    volumes:
      - ./stream/output:/stream/output:ro

  stream:
    image: street-eye-stream:local
    build:
      context: ./stream
      dockerfile: Dockerfile
    volumes:
      - ./stream/output:/output

  frontend:
    image: node:22-alpine


