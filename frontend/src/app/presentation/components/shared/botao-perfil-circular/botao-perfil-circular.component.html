<button type="button" class="profile-button" [matMenuTriggerFor]="menu"
  [style.width.px]="largura" [style.height.px]="altura"
  [style.backgroundColor]="cor" [style.color]="corTexto"
  [attr.aria-label]="'Perfil de ' + usuario.login">
  {{ iniciaisNomeUsuario }}
</button>
<mat-menu #menu="matMenu">
  <button mat-menu-item routerLink="/perfil">Meu Perfil</button>
  <button mat-menu-item (click)="sair.emit()">Sair</button>
</mat-menu>
