<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <h1>Street Eye</h1>
    </div>

    <h2 class="login-title">Faça login na sua conta</h2>
    <p class="login-subtitle">Insira suas credenciais abaixo</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuário <span>*</span></label>
        <div
          class="input-wrapper"
          [class.invalid]="
            form.get('username')?.invalid && form.get('username')?.touched
          "
        >
          <span class="icon">👤</span>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="admin"
          />
        </div>
        @if (form.get('username')?.invalid && form.get('username')?.touched) {
        <small class="error-msg"> Campo obrigatório </small>
        }
      </div>

      <div class="form-group">
        <label for="password">Senha <span>*</span></label>
        <div
          class="input-wrapper"
          [class.invalid]="
            form.get('password')?.invalid && form.get('password')?.touched
          "
        >
          <span class="icon">🔒</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="********"
          />
        </div>
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <small class="error-msg"> Campo obrigatório </small>
        }
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
